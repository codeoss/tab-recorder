<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Tab 录制大师 — 保存状态</title>
  <style>
    :root{--bg:#12121a;--panel:#1e1e2e;--text:#e8e8ef;--muted:#9999ad;--accent:#ff4757;--ok:#2ed573;--warn:#ffa502}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;padding:28px;background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;display:flex;align-items:center;justify-content:center}
    main{width:100%;max-width:360px;text-align:center}
    h1{font-size:21px;line-height:1.4;margin-bottom:12px}
    #detail{font-size:13px;color:var(--muted);line-height:1.65;word-break:break-all}
    #progress{width:100%;height:8px;margin:24px 0 8px;accent-color:var(--warn)}
    #progressText{font-size:12px;color:var(--muted);min-height:20px;line-height:1.6}
    .actions{display:flex;justify-content:center;gap:10px;margin-top:24px;flex-wrap:wrap}
    button{padding:9px 16px;border:1px solid #35354a;border-radius:8px;background:var(--panel);color:var(--text);font:600 12px inherit;cursor:pointer}
    button:hover{background:#2a2a3a}
    button:disabled{opacity:.45;cursor:default}
    #retryBtn{border-color:var(--warn);color:var(--warn)}
    #discardBtn{border-color:var(--accent);color:var(--accent)}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main>
    <h1 id="title">正在读取保存状态…</h1>
    <p id="detail">请勿关闭浏览器。</p>
    <progress id="progress" max="100" value="0"></progress>
    <div id="progressText"></div>
    <div class="actions">
      <button id="retryBtn" hidden>重试保存</button>
      <button id="discardBtn" hidden>丢弃这次录制</button>
      <button id="closeBtn">关闭</button>
    </div>
  </main>
  <script src="save-status.js"></script>
</body>
</html>
